# Ping /api/cron/live-matches EN CONTINU (toutes les 30 s) PENDANT la Coupe.
#
# GitHub Actions ne sait pas planifier sous 5 min (`*/5` = cadence mini). Pour
# obtenir du 30 s SANS laptop, chaque run BOUCLE en interne ~5 min en pingant
# toutes les 30 s ; le run suivant (planifié +5 min) prend le relais → couverture
# continue 30 s, 100 % côté serveur (gratuit, pas de machine locale à laisser
# tournée). C'est ce 30 s qui alimente la barre de pression (1 snapshot / 30 s,
# table match_pressure) en plus de rafraîchir scores & buts.
#
# L'endpoint /api/cron/live-matches est LÉGER et garde-fou : hors fenêtre live
# d'un match il sort immédiatement, 0 appel API-Football → laisser boucler hors
# match ne coûte rien.
#
# ⚠ Quota API-Football : pendant un match, ~3 appels / ping × 30 s ≈ 360 appels
# sur 90 min PAR match. Sur plusieurs matchs simultanés, surveille ton plafond ;
# pour lever le pied, repasse STEP_SECONDS à 60 (ci-dessous).
#
# Secrets repo requis (déjà configurés pour sync-matches.yml) :
#   - CRON_SECRET  : même valeur que la var Vercel CRON_SECRET
#   - APP_BASE_URL : URL prod (ex. https://canal-cup.vercel.app — sans / final)
#
# Fenêtre : 11/06/2026 → 19/07/2026. Hors fenêtre, sortie en succès sans appel.
# Échec d'appel = NON bloquant (log seulement) — l'endpoint est idempotent.

name: Live matchs WC2026 (pression 30s, externe)

on:
  schedule:
    # Toutes les 5 min (UTC) — cadence mini GitHub Actions. Chaque run boucle
    # ensuite en 30 s pour combler l'intervalle. Best-effort : un déclenchement
    # peut être différé (acceptable, endpoint idempotent).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Jamais 2 boucles live concurrentes : le run suivant attend la fin du courant
# (les boucles ~5 min s'enchaînent donc proprement).
concurrency:
  group: live-matches
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # Boucle ~5 min ; timeout de sécurité au cas où.
    timeout-minutes: 7
    steps:
      - name: Garde de fenêtre Coupe du Monde
        id: window
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          START="2026-06-11"
          END="2026-07-19"
          if [[ "$TODAY" < "$START" || "$TODAY" > "$END" ]]; then
            echo "[$TODAY] hors fenêtre CdM ($START → $END) — skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "[$TODAY] dans la fenêtre CdM — boucle 30 s."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping /api/cron/live-matches en boucle 30 s
        if: steps.window.outputs.run == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # Pas besoin d'une barre toutes les 30 s ? Passe à 60 pour le quota.
          STEP_SECONDS: "30"
          # Durée totale de la boucle (un poil < 5 min pour ne pas chevaucher
          # le run planifié suivant ; la concurrence rattrape de toute façon).
          LOOP_SECONDS: "285"
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_BASE_URL" ]; then
            echo "::warning::CRON_SECRET ou APP_BASE_URL manquant — skip."
            exit 0
          fi
          URL="${APP_BASE_URL%/}/api/cron/live-matches"
          echo "→ boucle ${STEP_SECONDS}s sur $URL pendant ~${LOOP_SECONDS}s"
          START=$(date +%s)
          i=0
          while :; do
            ELAPSED=$(( $(date +%s) - START ))
            [ "$ELAPSED" -ge "$LOOP_SECONDS" ] && break
            i=$((i + 1))
            # -m 25 : un ping bloqué ne décale pas la cadence de 30 s.
            CODE=$(curl -sS -m 25 -o /tmp/live.out -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" "$URL" || echo "000")
            BODY=$(head -c 300 /tmp/live.out 2>/dev/null)
            echo "[$(date -u +%H:%M:%SZ)] #$i HTTP $CODE — $BODY"
            [ "$CODE" != "200" ] && echo "::warning::live HTTP $CODE (non bloquant)"
            # Pas de sleep final si le prochain pas dépasse la fenêtre.
            [ $(( $(date +%s) - START + STEP_SECONDS )) -ge "$LOOP_SECONDS" ] && break
            sleep "$STEP_SECONDS"
          done
          echo "fin boucle : $i pings en $(( $(date +%s) - START ))s"
          exit 0
